<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Abransh Baliyan — machine learning engineer working on vision-language models for document understanding">
  <defs>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFA94D" stop-opacity="0"/>
      <stop offset="42%" stop-color="#FFA94D" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#FFD9A8" stop-opacity="0.85"/>
      <stop offset="58%" stop-color="#FFA94D" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#FFA94D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5FD3BC" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#5FD3BC" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.05" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>
    <clipPath id="nameClip">
      <rect x="52" y="106" width="0" height="82">
        <animate attributeName="width" values="0;700" dur="1.45s" begin="0.3s" fill="freeze"
                 calcMode="spline" keyTimes="0;1" keySplines="0.16 0.84 0.24 1"/>
      </rect>
    </clipPath>
    <clipPath id="pageClip"><rect x="856" y="54" width="288" height="212" rx="10"/></clipPath>
  </defs>

  <style>
    .m    { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    .ink  { fill:#E8E3D9; }
    .mute { fill:#7D8694; }
    .low  { fill:#59616E; }

    .cursor { fill:#FFA94D; opacity:0; animation: blink 1.05s steps(1) infinite; animation-delay:1.7s; }
    @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }

    .sub  { opacity:0; animation: rot 13.5s ease-in-out infinite; }
    .sub-b { animation-delay: 4.5s; }
    .sub-c { animation-delay: 9s; }
    @keyframes rot {
      0%   { opacity:0; transform: translateY(7px) }
      3%   { opacity:1; transform: translateY(0) }
      28%  { opacity:1; transform: translateY(0) }
      32%  { opacity:0; transform: translateY(-7px) }
      100% { opacity:0; transform: translateY(-7px) }
    }

    .struct { opacity:0; animation: resolve 5.4s ease-in-out infinite; }
    @keyframes resolve {
      0%,14% { opacity:0 }
      46%    { opacity:1 }
      74%    { opacity:1 }
      90%,100% { opacity:0 }
    }

    .late { opacity:0; animation: fi .9s ease-out forwards; animation-delay:1.45s; }
    @keyframes fi { to { opacity:1 } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .late, .sub, .struct, .cursor { opacity:1 }
    }
  </style>

  <rect width="1200" height="320" rx="14" fill="#0A0C10"/>
  <rect width="1200" height="320" rx="14" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="none" stroke="#1C2029"/>

  <g stroke="#5FD3BC" stroke-opacity="0.4" stroke-width="1.4" fill="none">
    <path d="M22 40 V22 H40"/>
    <path d="M1160 22 H1178 V40"/>
    <path d="M22 280 V298 H40"/>
    <path d="M1178 280 V298 H1160"/>
  </g>

  <text class="m mute" x="52" y="76" font-size="15" letter-spacing="2.5">$ whoami</text>

  <g clip-path="url(#nameClip)">
    <text class="m ink" x="52" y="168" font-size="60" font-weight="700" letter-spacing="-1.5">ABRANSH BALIYAN</text>
  </g>
  <rect class="cursor" x="608" y="126" width="15" height="50"/>

  <rect class="late" x="52" y="192" width="0" height="2" fill="url(#ruleGrad)">
    <animate attributeName="width" values="0;540" dur="1.1s" begin="1.5s" fill="freeze"/>
  </rect>

  <g>
    <text class="m mute sub"        x="52" y="228" font-size="18.5">vision-language models for document understanding</text>
    <text class="m mute sub sub-b"  x="52" y="228" font-size="18.5">founder &amp; ceo @ infratex — parsing infrastructure for agents</text>
    <text class="m mute sub sub-c"  x="52" y="228" font-size="18.5">computer engineering @ politecnico di milano</text>
  </g>

  <text class="m low late" x="52" y="272" font-size="13" letter-spacing="2">MILAN, IT &#160;·&#160; INFRATEX.IO &#160;·&#160; PDF IN, TRUTH OUT</text>

  <g clip-path="url(#pageClip)">
    <rect x="856" y="54" width="288" height="212" rx="10" fill="#0D1017"/>

    <g fill="#21262F">
      <rect x="880" y="78"  width="152" height="13" rx="3"/>
      <rect x="880" y="106" width="240" height="7"  rx="3"/>
      <rect x="880" y="120" width="216" height="7"  rx="3"/>
      <rect x="880" y="134" width="232" height="7"  rx="3"/>
      <rect x="880" y="158" width="240" height="54" rx="3"/>
      <rect x="880" y="228" width="142" height="7"  rx="3"/>
    </g>

    <g class="struct">
      <rect x="880" y="78" width="152" height="13" rx="3" fill="#5FD3BC"/>
      <g fill="#5FD3BC" fill-opacity="0.42">
        <rect x="880" y="106" width="240" height="7" rx="3"/>
        <rect x="880" y="120" width="216" height="7" rx="3"/>
        <rect x="880" y="134" width="232" height="7" rx="3"/>
        <rect x="880" y="228" width="142" height="7" rx="3"/>
      </g>
      <g stroke="#5FD3BC" stroke-opacity="0.9" fill="none" stroke-width="1.15">
        <rect x="880" y="158" width="240" height="54" rx="3"/>
        <path d="M880 176 H1120 M880 194 H1120 M960 158 V212 M1040 158 V212"/>
      </g>
    </g>

    <rect x="856" width="288" height="58" fill="url(#beamGrad)">
      <animate attributeName="y" values="4;266;266" keyTimes="0;0.52;1" dur="5.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="856.5" y="54.5" width="287" height="211" rx="10" fill="none" stroke="#252B35"/>

  <text class="m low" x="856" y="288" font-size="11.5" letter-spacing="2.5">PAGE &#8594; STRUCTURE</text>
</svg>
